<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Browser Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Sora", "ui-sans-serif", "system-ui"],
              mono: ["IBM Plex Mono", "ui-monospace", "SFMono-Regular"],
            },
            boxShadow: {
              glow: "0 0 40px rgba(56, 189, 248, 0.35)",
              "glow-lg": "0 0 80px rgba(37, 99, 235, 0.45)",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased font-sans">
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div class="absolute -top-32 left-1/2 h-[28rem] w-[28rem] -translate-x-1/2 rounded-full bg-sky-500/20 blur-3xl"></div>
      <div class="absolute bottom-0 right-0 h-80 w-80 rounded-full bg-indigo-600/20 blur-3xl"></div>
      <div class="absolute top-1/3 left-8 h-64 w-64 rounded-full bg-cyan-400/10 blur-3xl"></div>
    </div>

    <main class="relative mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-6 py-16">
      <header class="mb-10 text-center">
        <p class="mb-3 text-xs font-semibold uppercase tracking-[0.35em] text-sky-400">Steel · Playwright · CDP</p>
        <h1 class="text-4xl font-semibold tracking-tight text-white sm:text-5xl">Browser Control Deck</h1>
        <p class="mt-3 text-sm text-slate-400">Dispatch a live AI browser session and watch the agent console in real time.</p>
      </header>

      <section class="rounded-3xl border border-white/10 bg-slate-900/70 p-6 shadow-glow backdrop-blur-xl sm:p-8">
        <label for="prompt" class="mb-3 block text-sm font-medium text-slate-300">Instruction prompt</label>
        <textarea
          id="prompt"
          rows="7"
          placeholder="e.g. Go to https://example.com and extract the page layout text"
          class="w-full resize-y rounded-2xl border border-slate-700/80 bg-slate-950/80 px-5 py-4 text-base leading-relaxed text-slate-100 outline-none ring-0 transition placeholder:text-slate-500 focus:border-sky-400/80 focus:shadow-glow"
        ></textarea>

        <button
          id="launch"
          type="button"
          class="mt-6 w-full rounded-2xl bg-gradient-to-r from-sky-500 via-blue-500 to-indigo-500 px-6 py-4 text-lg font-semibold text-white shadow-glow-lg transition hover:brightness-110 disabled:cursor-wait disabled:opacity-70"
        >
          Launch AI Browser Agent
        </button>
      </section>

      <section class="mt-8 overflow-hidden rounded-2xl border border-slate-800 bg-black shadow-2xl">
        <div class="flex items-center gap-2 border-b border-slate-800 px-4 py-3">
          <span class="h-3 w-3 rounded-full bg-red-500/80"></span>
          <span class="h-3 w-3 rounded-full bg-amber-400/80"></span>
          <span class="h-3 w-3 rounded-full bg-emerald-400/80"></span>
          <span class="ml-3 font-mono text-xs uppercase tracking-widest text-slate-500">agent console</span>
        </div>
        <pre
          id="terminal"
          class="h-72 overflow-y-auto whitespace-pre-wrap break-words px-5 py-4 font-mono text-sm leading-6 text-emerald-400"
        >
<span class="text-slate-500">awaiting launch...</span></pre>
      </section>
    </main>

    <script>
      const promptEl = document.getElementById("prompt");
      const launchBtn = document.getElementById("launch");
      const terminal = document.getElementById("terminal");

      function appendLog(line, tone = "log") {
        const span = document.createElement("span");
        span.textContent = line + "\n";
        span.className =
          tone === "error"
            ? "text-red-400"
            : tone === "result"
              ? "text-sky-300"
              : "text-emerald-400";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function resetTerminal() {
        terminal.textContent = "";
        appendLog("$ launching browser agent...");
      }

      async function launchAgent() {
        const prompt = promptEl.value.trim();
        if (!prompt) {
          promptEl.focus();
          return;
        }

        launchBtn.disabled = true;
        resetTerminal();

        try {
          const response = await fetch("/api/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });

          if (!response.ok || !response.body) {
            appendLog(`request failed (${response.status})`, "error");
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const chunks = buffer.split("\n\n");
            buffer = chunks.pop() || "";

            for (const chunk of chunks) {
              const line = chunk
                .split("\n")
                .filter((row) => row.startsWith("data: "))
                .map((row) => row.slice(6))
                .join("");
              if (!line) continue;

              let event;
              try {
                event = JSON.parse(line);
              } catch {
                appendLog(line);
                continue;
              }

              if (event.type === "log") {
                appendLog(event.message);
              } else if (event.type === "error") {
                appendLog(event.message, "error");
              } else if (event.type === "result") {
                appendLog("--- page layout text ---", "result");
                appendLog(event.text || "(empty)", "result");
              }
            }
          }
        } catch (err) {
          appendLog(String(err), "error");
        } finally {
          launchBtn.disabled = false;
        }
      }

      launchBtn.addEventListener("click", launchAgent);
      promptEl.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          launchAgent();
        }
      });
    </script>
  </body>
</html>
